[supervisord]
nodaemon=true
logfile=/tmp/supervisord.log
pidfile=/tmp/supervisord.pid

[unix_http_server]
file=/tmp/supervisor.sock
chmod=0777

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

# --- PostgreSQL Database ---
[program:postgresql]
command=postgres -D /data/postgres -k /tmp -p 5432
autostart=true
autorestart=true
stderr_logfile=/tmp/postgresql.err.log
stdout_logfile=/tmp/postgresql.out.log

# --- Redis Cache and Broker ---
[program:redis]
command=redis-server --dir /data/redis --port 6379 --protected-mode no
autostart=true
autorestart=true
stderr_logfile=/tmp/redis.err.log
stdout_logfile=/tmp/redis.out.log

# --- Qdrant Vector Database ---
[program:qdrant]
command=qdrant --storage-dir /data/qdrant
autostart=true
autorestart=true
stderr_logfile=/tmp/qdrant.err.log
stdout_logfile=/tmp/qdrant.out.log

# --- MinIO Object Storage ---
[program:minio]
command=minio server --address ":9000" --console-address ":9001" /data/minio
autostart=true
autorestart=true
stderr_logfile=/tmp/minio.err.log
stdout_logfile=/tmp/minio.out.log

# --- FastAPI Backend Server ---
[program:fastapi]
command=sh -c "until pg_isready -h localhost -k /tmp -p 5432; do sleep 1; done && alembic -c Backend_Service/alembic.ini upgrade head && uvicorn Backend_Service.backend.app:app --host 0.0.0.0 --port 8000 --workers 4"
directory=/app
autostart=true
autorestart=true
stderr_logfile=/tmp/fastapi.err.log
stdout_logfile=/tmp/fastapi.out.log
environment=PYTHONUNBUFFERED=1,PYTHONPATH=/app:/app/Backend_Service:/app/AI_Service

# --- Celery Worker for AI Tasks ---
[program:celery_worker]
command=sh -c "until pg_isready -h localhost -k /tmp -p 5432; do sleep 1; done && celery -A AI_Service.workers.celery_app worker --loglevel=info --concurrency=4"
directory=/app
autostart=true
autorestart=true
stderr_logfile=/tmp/celery_worker.err.log
stdout_logfile=/tmp/celery_worker.out.log
environment=PYTHONUNBUFFERED=1,PYTHONPATH=/app:/app/Backend_Service:/app/AI_Service

# --- Celery Beat Scheduler ---
[program:celery_beat]
command=sh -c "until pg_isready -h localhost -k /tmp -p 5432; do sleep 1; done && celery -A AI_Service.workers.celery_app beat --loglevel=info"
directory=/app
autostart=true
autorestart=true
stderr_logfile=/tmp/celery_beat.err.log
stdout_logfile=/tmp/celery_beat.out.log
environment=PYTHONUNBUFFERED=1,PYTHONPATH=/app:/app/Backend_Service:/app/AI_Service
