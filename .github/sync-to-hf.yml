
name: Sync to Hugging Face Hub
on:
  push:
    branches: [master] 

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to Hub
        uses: huggingface/hub-sync@v0.1.0
        with:
          github_repo_id: ${{ github.repository }}
          huggingface_repo_id: Shubham71205/RA2 
          hf_token: ${{ secrets.HUGGINGFACEHUB_WRITE_TOKEN }}
          repo_type: space
