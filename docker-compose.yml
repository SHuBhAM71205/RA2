services:
  db:
    container_name: RA_POSTGRES
    image: postgres:17
    

    environment:
      POSTGRES_DB: ${PG_DB_NAME}
      POSTGRES_USER: ${PG_DB_USER}
      POSTGRES_PASSWORD: ${PG_DB_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${PG_DB_USER} -d ${PG_DB_NAME}"
        ]
      interval: 5s
      timeout: 3s
      retries: 5

    networks:
      - backend

  qdrant:
    container_name: RA_QDRANT
    image: qdrant/qdrant:latest
    ports: 
      - "6333:6333" 
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

    networks:
      - backend

  minio:
    image: minio/minio:latest
    container_name: RA_MINIO
    command: server --console-address ":9001" /data
    ports:
      - "9000:9000" 
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - backend

  redis:
    container_name: RA_REDIS
    image: redis:7
    restart: unless-stopped

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    command:
      [
        "redis-server",
        "--appendonly",
        "yes"
      ]
    
    healthcheck:
        test: ["CMD", "redis-cli", "ping"]
        interval: 5s
        timeout: 3s
        retries: 5

    networks:
        - backend

  celery-worker:
    container_name: RA_CELERY_WORKER

    build:
      context: ./AI_Service
      dockerfile: Dockerfile

    env_file:
      - .env

    environment:
      - QDRANT_HOST=qdrant
      - MINIO_HOST=minio
      - A_CELERY_BROKER_HOST=redis
      - A_CELERY_BACKEND_HOST=redis

    command: >
      celery
      -A workers.celery_app
      worker
      --loglevel=info

    depends_on:
      redis:
        condition: service_healthy

      db:
        condition: service_healthy

    networks:
      - backend

  celery-beat:
    container_name: RA_CELERY_BEAT

    build:
      context: ./AI_Service
      dockerfile: Dockerfile

    env_file:
      - .env

    environment:
      - QDRANT_HOST=qdrant
      - MINIO_HOST=minio
      - A_CELERY_BROKER_HOST=redis
      - A_CELERY_BACKEND_HOST=redis

    command: >
      celery
      -A workers.celery_app
      beat
      --loglevel=info

    depends_on:
      redis:
        condition: service_healthy

      db:
        condition: service_healthy

    networks:
      - backend

  frontend:
    container_name: RA_FRONTEND
    build:
      context: ./Frontend_Service
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:8000
    ports:
      - "3000:80"
    networks:
      - backend

volumes:
  postgres_data:
  pg_admin_data:
  qdrant_data:
  minio_data:
  redis_data:

networks:
  backend:
    driver: bridge