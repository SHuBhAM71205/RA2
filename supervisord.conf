[supervisord]
nodaemon=true
user=root
logfile=/dev/stdout
logfile_maxbytes=0


[program:postgres]
command=/usr/lib/postgresql/16/bin/postgres -D /data/postgres
user=postgres
priority=1
startsecs=3
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:redis]
command=redis-server --dir /data/redis --appendonly yes --port 6379
user=redis
priority=2
startsecs=2
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:qdrant]
# We remove the invalid CLI flag and configure data persistence via Qdrant's ENV layout
command=qdrant
environment=QDRANT__STORAGE__STORAGE_PATH="/data/qdrant"
user=root
priority=3
startsecs=2
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:minio]
command=minio server --console-address ":9001" /data/minio
user=root
priority=4
startsecs=3
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0


[program:fastapi]
command=bash -c 'until pg_isready -h 127.0.0.1 -p 5432 >/dev/null 2>&1; do sleep 1; done; cd /app && /opt/venv/bin/alembic -c /app/Backend_Service/alembic.ini upgrade head && /opt/venv/bin/uvicorn Backend_Service.backend.app:app --host 0.0.0.0 --port 7860'
directory=/app
user=root
priority=10
startsecs=3
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0


[program:celery-worker]
command=/opt/venv/bin/celery -A workers.celery_app worker --loglevel=info
directory=/app/AI_Service
user=root
priority=20
startsecs=2
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:celery-beat]
command=/opt/venv/bin/celery -A workers.celery_app beat --loglevel=info
directory=/app/AI_Service
user=root
priority=30
startsecs=2
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
